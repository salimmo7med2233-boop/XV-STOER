<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>XV | لوحة التحكم</title><style>
*{box-sizing:border-box}body{margin:0;background:#05070b;color:#eee;font-family:Arial,sans-serif}body:before{content:"";position:fixed;inset:0;pointer-events:none;background:linear-gradient(125deg,transparent 38%,rgba(0,120,255,.09) 39%,transparent 41%),linear-gradient(35deg,transparent 70%,rgba(0,140,255,.07) 71%,transparent 73%)}.wrap{max-width:1100px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:18px}.logo{font-size:28px;font-weight:900;letter-spacing:5px}.logo span{color:#ff1744}.btn{border:1px solid #ff1744;background:#0b0d12;color:#fff;border-radius:12px;padding:11px 15px;cursor:pointer}.btn.blue{border-color:#168cff}.panel{background:rgba(12,15,22,.86);border:1px solid #252a35;border-radius:18px;padding:18px;box-shadow:0 0 35px rgba(0,100,255,.08);margin-bottom:16px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.field{display:flex;flex-direction:column;gap:7px}.field.full{grid-column:1/-1}label{color:#aaa;font-size:14px}input,textarea,select{width:100%;background:#080b10;color:#fff;border:1px solid #303642;border-radius:10px;padding:12px;font-size:15px}textarea{min-height:90px;resize:vertical}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.login{max-width:430px;margin:70px auto}.hidden{display:none!important}.msg{padding:10px;border-radius:10px;margin-top:10px;background:#10151d;color:#9fc8ff}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}.toolbar input{flex:1;min-width:220px}.products{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.item{border:1px solid #292e38;border-radius:14px;padding:12px;background:#090c12}.item img{width:100%;height:190px;object-fit:cover;border-radius:10px;background:#000}.item h3{margin:9px 0 4px}.muted{color:#8d96a5;font-size:13px}.danger{border-color:#ff3b5f;color:#ff8095}.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.thumb{width:78px;height:78px;object-fit:cover;border-radius:8px;border:1px solid #333}.stat{font-size:13px;color:#aeb7c7;margin-bottom:12px}@media(max-width:700px){.grid,.products{grid-template-columns:1fr}.top{align-items:flex-start}.logo{font-size:22px}}
</style></head><body><div class="wrap">
<div id="login" class="panel login"><div class="logo">VEYR<span>O</span></div><h2>لوحة تحكم المتجر</h2><p class="muted">سجّل دخولك بحساب المدير.</p><div class="field"><label>البريد الإلكتروني</label><input id="email" type="email" autocomplete="username"></div><div class="field" style="margin-top:10px"><label>كلمة المرور</label><input id="password" type="password" autocomplete="current-password"></div><div class="actions"><button class="btn blue" onclick="login()">دخول</button></div><div id="loginMsg"></div></div>
<div id="app" class="hidden"><div class="top"><div><div class="logo">VEYR<span>O</span></div><div class="muted">لوحة تحكم المتجر</div></div><div class="actions"><button class="btn" onclick="newProduct()">＋ منتج جديد</button><button class="btn" onclick="loadProducts()">↻ تحديث</button><button class="btn danger" onclick="logout()">خروج</button></div></div>
<div class="panel"><h2>إعدادات المتجر</h2><div class="grid"><div class="field"><label>رقم واتساب الطلبات</label><input id="whatsapp" inputmode="tel" placeholder="201221009017"><div class="muted">اكتب الرقم بصيغة دولية بدون + أو مسافات، مثال مصر: 201221009017</div></div><div class="field"><label>رابط Instagram</label><input id="instagram" type="url" placeholder="https://www.instagram.com/yourpage/"></div><div class="field"><label>رابط TikTok</label><input id="tiktok" type="url" placeholder="https://www.tiktok.com/@yourpage"></div></div><div class="actions"><button class="btn blue" onclick="saveSettings()">حفظ إعدادات المتجر</button></div><div id="settingsMsg"></div></div>
<div class="panel"><div class="toolbar"><input id="search" placeholder="ابحث باسم المنتج..." oninput="render()"><select id="filter" onchange="render()"><option value="all">كل المنتجات</option><option value="active">الظاهرة</option><option value="hidden">المخفية</option></select></div><div class="stat" id="status">جارٍ الاتصال...</div><div id="products" class="products"></div></div>
<div id="editor" class="panel hidden"><h2 id="editorTitle">إضافة منتج</h2><input id="pid" type="hidden"><div class="grid"><div class="field"><label>اسم المنتج</label><input id="name"></div><div class="field"><label>القسم</label><select id="cat"><option>سيارات</option><option>موتوسيكلات</option><option>شخصيات</option><option>أنمي</option><option>PlayStation</option><option>Gaming</option><option>عبارات</option><option>تصميمات أخرى</option></select></div><div class="field"><label>السعر الأساسي</label><input id="price" type="number"><div class="muted">يُستخدم كالسعر الاحتياطي</div></div><div class="field"><label>السعر القديم</label><input id="old" type="number"></div><div class="field full"><label>أسعار المقاسات</label><div class="grid"><div class="field"><label>30×40 سم</label><input id="price3040" type="number" min="0"></div><div class="field"><label>40×60 سم</label><input id="price4060" type="number" min="0"></div><div class="field"><label>50×70 سم</label><input id="price5070" type="number" min="0"></div></div><div class="muted">كل مقاس له سعر مستقل. السعر الأساسي يُستخدم إذا لم يتم تحديد سعر للمقاس.</div></div><div class="field"><label>الشارة</label><input id="badge" placeholder="جديد / مميز / عرض"></div><div class="field full"><label>الوصف</label><textarea id="desc"></textarea></div><div class="field full"><label>صور المنتج</label><input id="images" type="file" accept="image/*" multiple><div id="thumbs" class="thumbs"></div></div></div><div class="actions"><button class="btn blue" onclick="saveProduct()">حفظ المنتج</button><button class="btn" onclick="closeEditor()">إلغاء</button></div><div id="editMsg"></div></div>
</div></div>
<script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const SUPABASE_URL=(window.VEYRO_CONFIG||{}).SUPABASE_URL||''; const SUPABASE_ANON_KEY=(window.VEYRO_CONFIG||{}).SUPABASE_ANON_KEY||'';
let sb=null, products=[], editing=null;
let storeSettings={whatsapp:'201221009017',instagram:'',tiktok:''};
function configured(){return SUPABASE_URL&&SUPABASE_ANON_KEY&&SUPABASE_URL.startsWith('http')}
if(configured()) sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
function msg(id,t,ok=false){document.getElementById(id).innerHTML='<div class="msg">'+t+'</div>'}
async function login(){if(!sb)return msg('loginMsg','لسه محتاجين نحط بيانات Supabase في الملف أولًا.');let email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;let {error}=await sb.auth.signInWithPassword({email,password});if(error)return msg('loginMsg','فشل الدخول: '+error.message);showApp();loadSettings();loadProducts()}
async function logout(){if(sb)await sb.auth.signOut();document.getElementById('app').classList.add('hidden');document.getElementById('login').classList.remove('hidden')}
async function showApp(){document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');await loadSettings()}
async function loadSettings(){if(!sb)return;let {data,error}=await sb.from('store_settings').select('*').eq('id',1).maybeSingle();if(!error&&data){storeSettings.whatsapp=data.whatsapp||'201221009017';storeSettings.instagram=data.instagram||'';storeSettings.tiktok=data.tiktok||'';document.getElementById('whatsapp').value=storeSettings.whatsapp;document.getElementById('instagram').value=storeSettings.instagram;document.getElementById('tiktok').value=storeSettings.tiktok}}
async function saveSettings(){if(!sb)return msg('settingsMsg','اربط Supabase أولًا.');let raw=document.getElementById('whatsapp').value.trim();let wa=raw.replace(/[^0-9]/g,'');if(wa.startsWith('00'))wa=wa.slice(2);if(wa.startsWith('0'))wa='20'+wa.slice(1);if(wa.length<10) return msg('settingsMsg','رقم واتساب غير صحيح. اكتبه بصيغة دولية مثل 201221009017.');let instagram=document.getElementById('instagram').value.trim();let tiktok=document.getElementById('tiktok').value.trim();let {error}=await sb.from('store_settings').upsert({id:1,whatsapp:wa,instagram,tiktok,updated_at:new Date().toISOString()});if(error)return msg('settingsMsg','حصل خطأ: '+error.message);storeSettings.whatsapp=wa;storeSettings.instagram=instagram;storeSettings.tiktok=tiktok;document.getElementById('whatsapp').value=wa;msg('settingsMsg','تم حفظ إعدادات المتجر بنجاح ✅');}
async function loadProducts(){if(!sb){document.getElementById('status').textContent='وضع التجهيز: اربط Supabase من ملف admin.html و index.html.';products=[];render();return}let {data,error}=await sb.from('products').select('*').order('created_at',{ascending:false});if(error){document.getElementById('status').textContent='خطأ في تحميل المنتجات: '+error.message;return}products=data||[];document.getElementById('status').textContent='عدد المنتجات: '+products.length;render()}
function render(){let q=(document.getElementById('search')?.value||'').trim().toLowerCase();let f=document.getElementById('filter')?.value||'all';let list=products.filter(p=>(!q||String(p.name||'').toLowerCase().includes(q))&&(f==='all'||(f==='active'?(p.active!==false):(p.active===false))));document.getElementById('products').innerHTML=list.length?list.map(p=>`<div class="item"><img src="${p.images?.[0]||'contact.jpg'}"><h3>${esc(p.name)} ${p.active===false?'· مخفي':''}</h3><div class="muted">${esc(p.cat)} · ${p.price} جنيه${p.old_price?' · القديم '+p.old_price+' جنيه':''}</div><div class="actions"><button class="btn blue" onclick="editProduct('${p.id}')">تعديل</button><button class="btn" onclick="toggleProduct('${p.id}')">${p.active===false?'إظهار':'إخفاء'}</button><button class="btn danger" onclick="deleteProduct('${p.id}')">حذف</button></div></div>`).join(''):'<div class="muted">مفيش نتائج.</div>'}
function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function newProduct(){editing=null;document.getElementById('editorTitle').textContent='إضافة منتج جديد';['pid','name','price','old','badge','desc','price3040','price4060','price5070'].forEach(id=>document.getElementById(id).value='');document.getElementById('thumbs').innerHTML='';document.getElementById('images').value='';document.getElementById('editor').classList.remove('hidden')}
function editProduct(id){editing=products.find(p=>p.id===id);if(!editing)return;document.getElementById('editorTitle').textContent='تعديل المنتج';document.getElementById('pid').value=id;document.getElementById('name').value=editing.name||'';document.getElementById('cat').value=editing.cat||'تصميمات أخرى';document.getElementById('price').value=editing.price||'';document.getElementById('old').value=editing.old_price||'';document.getElementById('badge').value=editing.badge||'';document.getElementById('desc').value=editing.description||'';let sp=editing.size_prices||{};document.getElementById('price3040').value=sp['30x40']??editing.price??'';document.getElementById('price4060').value=sp['40x60']??editing.price??'';document.getElementById('price5070').value=sp['50x70']??editing.price??'';document.getElementById('thumbs').innerHTML=(editing.images||[]).map((x,i)=>`<div style="position:relative"><img class="thumb" src="${x}"><button class="btn danger" style="position:absolute;top:2px;right:2px;padding:3px 7px" onclick="removeImage(${i})">×</button></div>`).join('');document.getElementById('editor').classList.remove('hidden')}
function closeEditor(){document.getElementById('editor').classList.add('hidden')}
async function uploadImages(files){let urls=[];for(const f of files){let safe=Date.now()+'_'+Math.random().toString(36).slice(2)+'_'+f.name.replace(/[^a-zA-Z0-9._-]/g,'_');let {error}=await sb.storage.from('product-images').upload(safe,f,{upsert:false});if(error)throw error;let {data}=sb.storage.from('product-images').getPublicUrl(safe);urls.push(data.publicUrl)}return urls}
async function saveProduct(){if(!sb)return msg('editMsg','اربط Supabase أولًا.');let id=document.getElementById('pid').value||crypto.randomUUID();let files=[...document.getElementById('images').files];try{let oldImgs=editing?.images||[];let newImgs=files.length?await uploadImages(files):[];let basePrice=Number(document.getElementById('price').value||0);let row={id,active:editing?.active!==false,name:document.getElementById('name').value.trim(),cat:document.getElementById('cat').value,price:basePrice,old_price:Number(document.getElementById('old').value||0),size_prices:{'30x40':Number(document.getElementById('price3040').value||basePrice),'40x60':Number(document.getElementById('price4060').value||basePrice),'50x70':Number(document.getElementById('price5070').value||basePrice)},badge:document.getElementById('badge').value.trim(),description:document.getElementById('desc').value.trim(),images:[...oldImgs,...newImgs]};if(!row.name)throw new Error('اكتب اسم المنتج');let {error}=await sb.from('products').upsert(row);if(error)throw error;closeEditor();await loadProducts()}catch(e){msg('editMsg','حصل خطأ: '+e.message)}}
async function removeImage(i){if(!editing)return;editing.images=(editing.images||[]).filter((_,idx)=>idx!==i);document.getElementById('thumbs').innerHTML=editing.images.map((x,j)=>`<div style="position:relative"><img class="thumb" src="${x}"><button class="btn danger" style="position:absolute;top:2px;right:2px;padding:3px 7px" onclick="removeImage(${j})">×</button></div>`).join('')}
async function toggleProduct(id){let p=products.find(x=>x.id===id);if(!p)return;let {error}=await sb.from('products').update({active:p.active===false}).eq('id',id);if(error)alert(error.message);else loadProducts()}
async function deleteProduct(id){if(!confirm('متأكد إنك عايز تحذف المنتج؟'))return;let {error}=await sb.from('products').delete().eq('id',id);if(error)alert(error.message);else loadProducts()}
(async()=>{if(sb){let {data}=await sb.auth.getSession();if(data.session){showApp();loadSettings();loadProducts()}}else document.getElementById('status').textContent='وضع التجهيز: اربط Supabase أولًا.'})()
</script></body></html>
